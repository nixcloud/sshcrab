description = "P2P (HyperDHT) backend of sshcrab: client connector, sshcrabd-p2p helper, DHT node"

[dependencies]
sshcrab-proto.workspace = true
# Pinned exactly: young, unaudited stack (SPECIFICATION.md §13).
peeroxide = "=1.8.1"
peeroxide-dht = "=1.8.1"
libudx = "=1.8.1"
tokio.workspace = true
clap.workspace = true
nix.workspace = true
bytes.workspace = true
log.workspace = true
env_logger.workspace = true
thiserror.workspace = true
postcard.workspace = true
# peeroxide logs with tracing; forward it to env_logger (RUST_LOG).
tracing = { version = "0.1", features = ["log"] }

[dev-dependencies]
env_logger.workspace = true
